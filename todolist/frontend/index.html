<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FormiTodo</title>
  <meta name="description" content="Application de gestion de tâches FormiCouple — Samuel, Nadia et Formicouple" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="#111"/>
          <path d="M7 9h14M7 14h10M7 19h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">FormiTodo</span>
      </div>
      <button class="menu-toggle" id="menuToggle" aria-label="Fermer le menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <p class="nav-label">Groupes</p>
      <button class="nav-item active" id="tab-formicouple" data-group="formicouple">
        <span class="nav-avatar" style="background:#D1FAE5; color:#065F46">FC</span>
        <span class="nav-name">Formicouple</span>
        <span class="nav-badge" id="badge-formicouple">0</span>
      </button>
      <button class="nav-item" id="tab-samuel" data-group="samuel">
        <span class="nav-avatar" style="background:#DBEAFE; color:#1D4ED8">S</span>
        <span class="nav-name">Samuel</span>
        <span class="nav-badge" id="badge-samuel">0</span>
      </button>
      <button class="nav-item" id="tab-nadia" data-group="nadia">
        <span class="nav-avatar" style="background:#FCE7F3; color:#BE185D">N</span>
        <span class="nav-name">Nadia</span>
        <span class="nav-badge" id="badge-nadia">0</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <p class="sidebar-date" id="todayDate"></p>
    </div>
  </aside>

  <!-- ─── Overlay mobile ───────────────────────────────────────────────────── -->
  <div class="overlay" id="overlay"></div>

  <!-- ─── Main ────────────────────────────────────────────────────────────── -->
  <main class="main">

    <!-- Top bar -->
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Ouvrir le menu">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="topbar-info">
        <h1 class="topbar-title" id="topbarTitle">Formicouple</h1>
        <p class="topbar-sub" id="topbarSub">Tâches partagées du couple</p>
      </div>
      <button class="btn-add-top" id="btnAddTop" aria-label="Ajouter une tâche">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>Nouvelle tâche</span>
      </button>
    </header>

    <!-- View tabs -->
    <div class="view-tabs" role="tablist">
      <button class="view-tab active" data-view="today" role="tab" aria-selected="true" id="view-today">Aujourd'hui</button>
      <button class="view-tab" data-view="todo" role="tab" aria-selected="false" id="view-todo">À faire</button>
      <button class="view-tab" data-view="week" role="tab" aria-selected="false" id="view-week">Cette semaine</button>
      <button class="view-tab" data-view="month" role="tab" aria-selected="false" id="view-month">Ce mois</button>
      <button class="view-tab" data-view="all" role="tab" aria-selected="false" id="view-all">Tout</button>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-chip" id="stat-total">
        <span class="stat-num">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-chip" id="stat-done">
        <span class="stat-num">0</span>
        <span class="stat-label">Complétées</span>
      </div>
      <div class="stat-chip" id="stat-pending">
        <span class="stat-num">0</span>
        <span class="stat-label">En attente</span>
      </div>
    </div>

    <!-- Task list -->
    <section class="task-list" id="taskList" aria-label="Liste des tâches">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="8" y="8" width="32" height="32" rx="6" stroke="#D1D5DB" stroke-width="2"/>
            <path d="M16 18h16M16 24h12M16 30h8" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="empty-title">Aucune tâche</p>
        <p class="empty-sub">Ajoutez votre première tâche avec le bouton +</p>
      </div>
    </section>

  </main>

  <!-- ─── Modal ajout de tâche ─────────────────────────────────────────────── -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Nouvelle tâche</h2>
        <button class="modal-close" id="modalClose" aria-label="Fermer">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M14 4L4 14M4 4l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <form id="taskForm" novalidate>

        <div class="form-group">
          <label class="form-label" for="taskTitle">Titre <span class="required">*</span></label>
          <input class="form-input" type="text" id="taskTitle" placeholder="Que faut-il faire ?" autocomplete="off" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="taskDate">Date</label>
            <input class="form-input" type="date" id="taskDate" />
          </div>
          <div class="form-group">
            <label class="form-label">Priorité</label>
            <div class="priority-btns" role="group" aria-label="Priorité">
              <button type="button" class="priority-btn" data-priority="low" id="prio-low">
                <span class="prio-dot low"></span> Basse
              </button>
              <button type="button" class="priority-btn active" data-priority="medium" id="prio-medium">
                <span class="prio-dot medium"></span> Moyenne
              </button>
              <button type="button" class="priority-btn" data-priority="high" id="prio-high">
                <span class="prio-dot high"></span> Haute
              </button>
            </div>
          </div>
        </div>

        <!-- Advanced options -->
        <details class="advanced-details" id="advancedDetails">
          <summary class="advanced-summary">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" class="summary-arrow">
              <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Paramètres avancés
          </summary>
          <div class="advanced-content">
            <div class="form-group">
              <label class="form-label" for="taskRecurrence">Répétition</label>
              <select class="form-input" id="taskRecurrence">
                <option value="none">Aucune</option>
                <option value="daily">Quotidienne</option>
                <option value="weekly">Hebdomadaire</option>
                <option value="monthly">Mensuelle</option>
              </select>
            </div>
          </div>
        </details>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btnCancel">Annuler</button>
          <button type="submit" class="btn btn-primary" id="btnSubmit">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Ajouter
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- ─── Toast notification ───────────────────────────────────────────────── -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
