<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}FormiMarket{% endblock %}</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <header>
        <h1>FormiMarket</h1>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="{{ url_for('formibase') }}" class="nav-item {% if request.endpoint == 'formibase' %}active{% endif %}">
            <i class="fas fa-database"></i>
        </a>
        <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
            <i class="fas fa-home"></i>
        </a>
        <a href="{{ url_for('shopping_list') }}"
            class="nav-item {% if request.endpoint == 'shopping_list' %}active{% endif %}">
            <i class="fas fa-list"></i>
        </a>
    </nav>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
