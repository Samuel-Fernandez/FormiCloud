# Nom du projet = "proxy" pour conserver le réseau existant "proxy_default"
# (les confs Nginx Proxy Manager joignent formiauth / formibudget par leur nom).
name: proxy

services:
  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./proxy/data:/data
      - ./proxy/letsencrypt:/etc/letsencrypt

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${DOMAIN}
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  formiauth:
    build: ./formiauth
    container_name: formiauth
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - AUTH_PASSWORD=${AUTH_PASSWORD:?AUTH_PASSWORD manquant dans .env}
      - COOKIE_SECRET=${COOKIE_SECRET:?COOKIE_SECRET manquant dans .env}
      - COOKIE_DOMAIN=.${DOMAIN}

  formimarket:
    build: ./FormiMarket
    container_name: formimarket
    restart: unless-stopped
    ports:
      - "1000:1000"
    volumes:
      - ./FormiMarket/data:/app/data

  formitodo:
    build: ./todolist/backend
    container_name: formitodo
    restart: unless-stopped
    ports:
      - "1001:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/todo.db
    volumes:
      - ./todolist/data:/app/data
      - ./todolist/frontend:/frontend:ro

  formifit:
    build: ./FormiFit
    container_name: formifit
    restart: unless-stopped
    ports:
      - "1004:1004"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?GOOGLE_API_KEY manquant dans .env}
    volumes:
      - ./FormiFit/data:/app/data
