<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FormiInk</title>
  <style>
    :root {
      --bg: #fff5f7; --card: #ffffff; --text: #2b1d22; --muted: #7a6870;
      --accent: #e5173f; --accent-soft: #ffe3ea; --border: #f0d5dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1215; --card: #261a1e; --text: #f6e9ed; --muted: #b59ea6;
        --accent: #ff6b86; --accent-soft: #3a2229; --border: #3d2a31;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 8px 0 20px; font-size: 1.6rem; }
    h1 span { color: var(--accent); }
    h2 { font-size: 1rem; margin: 0 0 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 16px; }

    .choices { display: grid; gap: 10px; }
    .choice {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      border: 2px solid var(--border); border-radius: 12px; cursor: pointer; background: transparent;
      color: inherit; font: inherit; text-align: left; width: 100%;
    }
    .choice:hover { border-color: var(--accent); }
    .choice.active { border-color: var(--accent); background: var(--accent-soft); }
    .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); flex: none; }
    .choice.active .dot { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--accent-soft); }
    .choice strong { display: block; }
    .choice small { color: var(--muted); }

    .preview { width: 100%; aspect-ratio: 800 / 480; background: #fff; border: 1px solid var(--border); border-radius: 8px; image-rendering: pixelated; display: block; }
    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 6px; }
    .tab { padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }

    label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
    input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
    .fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
    button.primary { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #status { margin-left: 12px; color: var(--muted); font-size: .9rem; }
    .hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
  </style>
</head>
<body>
<main>
  <h1>Formi<span>Ink</span></h1>

  <section>
    <h2>Écran affiché</h2>
    <div class="choices" id="choices"></div>
    <p class="hint">Le changement est pris en compte au prochain rafraîchissement de l'écran.</p>
  </section>

  <section>
    <div class="row">
      <h2 style="margin:0">Aperçu</h2>
      <div class="tabs" id="tabs"></div>
    </div>
    <img class="preview" id="preview" alt="Aperçu de l'écran">
  </section>

  <section id="bus-settings">
    <h2>Réglages · Départs de bus</h2>
    <label for="station">Arrêt</label>
    <input id="station" list="stations" autocomplete="off" placeholder="Lausanne, Pont-de-Chailly">
    <datalist id="stations"></datalist>
    <div class="fields">
      <div><label for="line">Ligne</label><input id="line" placeholder="7"></div>
      <div><label for="destination">Direction (début du nom)</label><input id="destination" placeholder="Prilly"></div>
      <div><label for="count">Nombre de départs</label><input id="count" type="number" min="1" max="6"></div>
    </div>
    <button class="primary" id="save">Enregistrer</button><span id="status"></span>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  let config = null;
  let screens = [];
  let previewScreen = null;

  async function api(path, options) {
    const res = await fetch(path, options);
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }

  function renderChoices() {
    $('choices').innerHTML = '';
    screens.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'choice' + (config.active === s.id ? ' active' : '');
      btn.innerHTML = `<span class="dot"></span><span><strong></strong><small></small></span>`;
      btn.querySelector('strong').textContent = s.label;
      btn.querySelector('small').textContent = s.description;
      btn.onclick = async () => {
        config = await api('/api/config', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ active: s.id })
        });
        previewScreen = s.id;
        renderAll();
      };
      $('choices').appendChild(btn);
    });
  }

  function renderTabs() {
    $('tabs').innerHTML = '';
    screens.forEach(s => {
      const b = document.createElement('button');
      b.className = 'tab' + (previewScreen === s.id ? ' on' : '');
      b.textContent = s.label;
      b.onclick = () => { previewScreen = s.id; renderTabs(); refreshPreview(); };
      $('tabs').appendChild(b);
    });
  }

  function refreshPreview() {
    $('preview').src = `/api/preview.png?screen=${previewScreen}&t=${Date.now()}`;
  }

  function fillBus() {
    $('station').value = config.bus.station;
    $('line').value = config.bus.line;
    $('destination').value = config.bus.destination;
    $('count').value = config.bus.count;
  }

  function renderAll() { renderChoices(); renderTabs(); refreshPreview(); }

  $('save').onclick = async () => {
    $('status').textContent = 'Enregistrement…';
    try {
      config = await api('/api/config', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bus: {
          station: $('station').value, line: $('line').value,
          destination: $('destination').value, count: $('count').value
        } })
      });
      fillBus();
      previewScreen = 'bus'; renderTabs(); refreshPreview();
      $('status').textContent = 'Enregistré ✓';
    } catch { $('status').textContent = 'Erreur lors de l\'enregistrement'; }
  };

  let typing;
  $('station').addEventListener('input', () => {
    clearTimeout(typing);
    typing = setTimeout(async () => {
      try {
        const names = await api('/api/stations?q=' + encodeURIComponent($('station').value));
        $('stations').innerHTML = names.map(n => `<option value="${n.replace(/"/g, '&quot;')}">`).join('');
      } catch {}
    }, 250);
  });

  (async function init() {
    [screens, config] = await Promise.all([api('/api/screens'), api('/api/config')]);
    previewScreen = config.active;
    fillBus();
    renderAll();
    setInterval(refreshPreview, 30000);
  })();
</script>
</body>
</html>
